# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# No API is used in production (VITE_API_URL is unset), so the site runs from src/data/content.js.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces a queued one but never cancels a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Project sites are served from /<repo-name>/; a <user>.github.io repo is served from /.
      - name: Work out the base path
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then base="/"; else base="/$repo/"; fi
          echo "VITE_BASE=$base" >> "$GITHUB_ENV"
          echo "Base path: $base"
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
